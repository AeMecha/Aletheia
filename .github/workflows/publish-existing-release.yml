name: Publish verified release artifacts

# Resume publication without rebuilding installers that already passed both
# native checks. Changing this recovery workflow deliberately triggers a retry.
on:
  push:
    branches: [master]
    paths: [.github/workflows/publish-existing-release.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v0.1.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALETHEIA_RELEASE_TAG: v0.1.2
      ALETHEIA_BUILD_RUN_ID: '40070932849'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify artifact provenance and both native checks
        run: node scripts/ci-command.js node scripts/verify-release-build.js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aletheia-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.ALETHEIA_BUILD_RUN_ID }}
      - name: Create corresponding source from the verified tag
        run: git archive --format=zip --prefix=Aletheia-0.1.2/ --output=release-assets/Aletheia-Source-0.1.2.zip v0.1.2
      - name: Upload, verify and publish the release
        run: node scripts/ci-command.js node scripts/publish-release.js
